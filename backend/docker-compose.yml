services:
  mysql:
    image: mysql:8.4
    container_name: reliefroute-mysql
    environment:
      MYSQL_DATABASE: reliefroute
      MYSQL_USER: reliefroute
      MYSQL_PASSWORD: reliefroute_dev
      MYSQL_ROOT_PASSWORD: change_me_root
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
