spring:
  application.name: reliefroute-api
management.endpoints.web.exposure.include: health,info
server.port: ${PORT:8080}
reliefroute.firebase.enabled: ${FIREBASE_ENABLED:true}
reliefroute.firebase.project-id: ${FIREBASE_PROJECT_ID:reliefroute-90279}
reliefroute.firebase.storage-bucket: ${FIREBASE_STORAGE_BUCKET:reliefroute-90279.firebasestorage.app}
reliefroute.firebase.service-account: ${FIREBASE_SERVICE_ACCOUNT:firebase-service-account.json}
reliefroute.auth.required: ${AUTH_REQUIRED:false}
reliefroute.cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5000,http://localhost:3000}
