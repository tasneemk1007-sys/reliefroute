spring:
  application.name: reliefroute-api
management.endpoints.web.exposure.include: health,info
server.port: ${PORT:8080}
spring.datasource.url: ${DB_URL:jdbc:mysql://localhost:3306/reliefroute?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username: ${DB_USERNAME:root}
spring.datasource.password: ${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size: ${DB_POOL_SIZE:10}
spring.flyway.enabled: ${FLYWAY_ENABLED:true}
spring.jpa.open-in-view: false
reliefroute.firebase.enabled: ${FIREBASE_ENABLED:true}
reliefroute.firebase.project-id: ${FIREBASE_PROJECT_ID:reliefroute4}
reliefroute.firebase.storage-bucket: ${FIREBASE_STORAGE_BUCKET:reliefroute4.firebasestorage.app}
reliefroute.firebase.storage-enabled: ${FIREBASE_STORAGE_ENABLED:true}
# Leave empty to use Google Application Default Credentials, including
# GOOGLE_APPLICATION_CREDENTIALS for local development and Cloud Run.
reliefroute.firebase.service-account: ${FIREBASE_SERVICE_ACCOUNT:}
reliefroute.auth.required: ${AUTH_REQUIRED:true}
reliefroute.cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5000,http://localhost:3000}
