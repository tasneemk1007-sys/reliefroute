spring.application.name=reliefroute-backend
server.port=${PORT:8080}

# Cloud Run uses Application Default Credentials. For local development only,
# set FIREBASE_SERVICE_ACCOUNT to a path or classpath filename.
reliefroute.firebase.project-id=${FIREBASE_PROJECT_ID:reliefroute4}
reliefroute.firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}
reliefroute.firebase.storage-enabled=${FIREBASE_STORAGE_ENABLED:false}
supabase.url=${SUPABASE_URL:https://subleenchffktpevunkt.supabase.co}
supabase.bucket=${SUPABASE_BUCKET:reliefroute}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
reliefroute.firebase.service-account=${FIREBASE_SERVICE_ACCOUNT:firebase-service-account.json}
reliefroute.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5000,http://localhost:3000}
